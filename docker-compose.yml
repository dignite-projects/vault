services:
  # Local PaddleOCR sidecar. The host's default OCR provider is VisionLlm, so it is
  # not needed by default. It is profile-gated; start it only after switching
  # [DependsOn] back to Ocr.PaddleOcr. The rest of the development environment
  # (SQL Server, the host, the SPA, the OpenTelemetry dashboard) is the Aspire
  # AppHost: dotnet run --project src/Dignite.Vault.AppHost
  #
  #   docker compose --profile paddleocr up -d paddleocr
  #
  paddleocr:
    build:
      context: ./etc/paddleocr-server
    profiles: ["paddleocr"]
    ports:
      - "8866:8866"
    environment:
      PADDLEOCR_USE_GPU: "false"
    volumes:
      - paddleocr_models:/root/.paddlex
      - hf_cache:/root/.cache/huggingface
    restart: unless-stopped

volumes:
  paddleocr_models:
  hf_cache:
