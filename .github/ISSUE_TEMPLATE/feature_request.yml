name: Feature request / proposal
description: Propose a change or new capability for Dignite Vault Extract.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Dignite Vault Extract is a **channel layer** with a deliberately narrow scope.
        Before proposing, please skim CLAUDE.md — especially the **Architecture** section.
        Vectorization / retrieval / chat / RAG belong to the planned vault.index module; business-field
        schemas and business modules belong in downstream consumers, not this repo.
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to achieve? What is the channel-layer use case?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What should change, and roughly where (OCR pipeline / exit contract / field architecture / document-type model / operator UI / host)?
    validations:
      required: true
  - type: dropdown
    id: boundary
    attributes:
      label: Is this a boundary change?
      description: >
        A boundary change alters a contract visible outside its module: exit contracts (REST / MCP /
        EventBus / Webhook, event payloads), a module's public API or the module-reference rules,
        serialized string contracts, or a rule in CLAUDE.md / .claude/rules/. Typical cases are the
        OCR / text-extraction pipeline, the field architecture, the document-type tier system, the
        Markdown-first contract and the security covenant. Boundary changes are design decisions that
        must reach consensus in this issue before the implementing PR is opened; a throwaway spike may
        come first (CONTRIBUTING.md → Issue-first principle).
      options:
        - "No — implementation detail (bug fix / wording / internal refactor / new provider behind an existing contract)"
        - "Yes — changes a contract outside its module (needs design consensus here first)"
        - "Not sure"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Including whether a downstream consumer could do this instead of the channel.
    validations:
      required: false
